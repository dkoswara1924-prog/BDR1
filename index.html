<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen Kelas IV A - SDN Purwaraja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏫 Absensi Kelas IV A</h1>
      <h2>SDN Purwaraja Menes Pandeglang</h2>
    </header>

    <!-- Form Input Harian -->
    <section class="card">
      <h3>📝 Input Absen & Tugas Harian</h3>
      <form id="absenForm">
        <div class="form-group">
          <label for="tanggal">Hari & Tanggal:</label>
          <input type="date" id="tanggal" required>
        </div>

        <div class="form-group">
          <label for="nama">Nama Siswa:</label>
          <input type="text" id="nama" placeholder="Masukkan nama siswa" required>
        </div>

        <div class="form-group">
          <label for="kehadiran">Status Kehadiran:</label>
          <select id="kehadiran">
            <option value="Hadir">🟢 Hadir</option>
            <option value="Izin">🟡 Izin</option>
            <option value="Sakit">🔵 Sakit</option>
            <option value="Alpa">🔴 Alpa</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mapel">Mata Pelajaran / Tugas:</label>
          <input type="text" id="mapel" placeholder="Contoh: Matematika PR Hal 12">
        </div>

        <div class="form-group">
          <label for="statusTugas">Status Tugas:</label>
          <select id="statusTugas">
            <option value="Sudah">✅ Sudah Mengumpulkan</option>
            <option value="Belum">❌ Belum Mengumpulkan</option>
          </select>
        </div>

        <div class="form-group">
          <label for="linkTugas">Link Tugas (Drive/File):</label>
          <input type="url" id="linkTugas" placeholder="https://drive.google.com/...">
        </div>

        <button type="submit" class="btn-primary">Simpan Data</button>
      </form>
    </section>

    <!-- Tabel Catatan Harian -->
    <section class="card">
      <h3>📋 Catatan Absen Hari Ini</h3>
      <div class="table-wrapper">
        <table id="tabelHarian">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Nama</th>
              <th>Kehadiran</th>
              <th>Mapel/Tugas</th>
              <th>Status Tugas</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Tab Rekapitulasi -->
    <section class="card">
      <h3>📊 Rekapitulasi Kehadiran & Tugas</h3>
      <div class="table-wrapper">
        <table id="tabelRekap">
          <thead>
            <tr>
              <th>Nama Siswa</th>
              <th>Hadir</th>
              <th>Izin</th>
              <th>Sakit</th>
              <th>Alpa</th>
              <th>Tugas Selesai</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
